<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 210" width="1300" height="210" role="img" aria-labelledby="t"><title id="t">Yixuan · 厨娘界元老, 书呆界新人 · 用更懒的方式过更好的人生</title><style>
@keyframes duckFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shine{0%{transform:translateX(-300px) rotate(0deg)}100%{transform:translateX(1400px) rotate(0deg)}}
@keyframes blink{0%,90%,100%{opacity:1}93%{opacity:0}96%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
.duck{animation:duckFloat 4s ease-in-out infinite}
.shine{animation:shine 5.5s cubic-bezier(.4,0,.2,1) infinite}
.eye-b{animation:blink 4.5s infinite}
.dot{animation:pulse 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#042F2E"/><stop offset=".55" stop-color="#0F172A"/><stop offset="1" stop-color="#042F2E"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".35"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#34D399"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1300" height="210" fill="url(#bg)"/>
<circle cx="650" cy="105" r="260" fill="url(#glow)"/>
<g class="duck">
<!-- 鸭子身体 -->
<ellipse cx="150" cy="140" rx="62" ry="52" fill="#FACC15"/>
<ellipse cx="150" cy="140" rx="62" ry="52" fill="none" stroke="#CA8A04" stroke-width="2"/>
<!-- 头 -->
<circle cx="196" cy="96" r="38" fill="#FDE047"/>
<circle cx="196" cy="96" r="38" fill="none" stroke="#CA8A04" stroke-width="2"/>
<!-- 头顶羽毛 -->
<path d="M172 66 C166 50 178 44 190 48 C186 36 204 30 212 44 C222 36 232 46 224 56 C214 62 200 62 172 66Z" fill="#FACC15" stroke="#CA8A04" stroke-width="1.5"/>
<!-- 嘴 -->
<path d="M232 98 L270 108 L232 118Z" fill="#F97316"/>
<path d="M232 106 L268 108 L232 110Z" stroke="#EA580C" stroke-width="1"/>
<!-- 眼睛 -->
<g class="eye-b">
<circle cx="207" cy="90" r="5.5" fill="#0F172A"/>
<circle cx="208.5" cy="88.5" r="1.8" fill="#fff"/>
</g>
<!-- 腮红 -->
<circle cx="222" cy="110" r="5" fill="#FDA4AF" opacity=".6"/>
<!-- 翅膀 -->
<path d="M112 128 C96 122 92 142 108 152 C104 144 106 136 112 128Z" fill="#FDE047" stroke="#CA8A04" stroke-width="1.5"/>
<!-- 脚 -->
<path d="M128 186 L122 200 L138 196Z" fill="#FB923C"/>
<path d="M168 186 L162 200 L178 196Z" fill="#FB923C"/>
</g>
<!-- 文字区 -->
<text x="300" y="95" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="700" fill="url(#txt)">Yixuan</text>
<text x="300" y="130" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#A7F3D0" opacity=".9">厨娘界元老，书呆界新人 · 用更懒的方式过更好的人生</text>
<text x="300" y="162" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#5EEAD4" opacity=".75">Hola, I'm Yixuan — indie creator, code tinkerer, life optimizer.</text>
<!-- 装饰点阵 -->
<g fill="#2DD4BF">
<circle class="dot" cx="1250" cy="40" r="3"/><circle class="dot" cx="1200" cy="175" r="2.5" style="animation-delay:.6s"/><circle class="dot" cx="1050" cy="30" r="2" style="animation-delay:1.1s"/><circle class="dot" cx="1150" cy="60" r="2.5" style="animation-delay:1.7s"/>
</g>
<!-- 扫光 -->
<g clip-path="url(#cp)"><rect class="shine" x="-320" y="0" width="300" height="210" fill="url(#sw)"/></g>
<defs><clipPath id="cp"><rect x="0" y="0" width="1300" height="210"/></clipPath></defs>
</svg>
