<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 210" width="1300" height="210" role="img" aria-labelledby="t"><title id="t">Yixuan · 厨娘界元老, 书呆界新人 · 用更懒的方式过更好的人生</title><style>
@keyframes walkIn{0%{transform:translate(60px,30px) scale(.82)}100%{transform:translate(0,0) scale(1)}}
@keyframes shine{0%{transform:translateX(-300px)}100%{transform:translateX(1400px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.9}}
.duck{animation:walkIn 4.2s cubic-bezier(.3,.6,.4,1) infinite alternate;transform-box:fill-box;transform-origin:center bottom}
.shine{animation:shine 5.5s cubic-bezier(.4,0,.2,1) infinite}
.dot{animation:pulse 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#042F2E"/><stop offset=".55" stop-color="#0F172A"/><stop offset="1" stop-color="#042F2E"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".35"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#34D399"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1300" height="210" fill="url(#bg)"/>
<circle cx="650" cy="105" r="260" fill="url(#glow)"/>
<g class="duck"><image href="data:image/jpeg;base64," x="20" y="15" width="250" height="250"/></g>
<text x="330" y="95" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="700" fill="url(#txt)">Yixuan</text>
<text x="330" y="130" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#A7F3D0" opacity=".9">厨娘界元老，书呆界新人 · 用更懒的方式过更好的人生</text>
<text x="330" y="162" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#5EEAD4" opacity=".75">Hola, I'm Yixuan — indie creator, code tinkerer, life optimizer.</text>
<g fill="#2DD4BF">
<circle class="dot" cx="1250" cy="40" r="3"/><circle class="dot" cx="1200" cy="175" r="2.5" style="animation-delay:.6s"/><circle class="dot" cx="1050" cy="30" r="2" style="animation-delay:1.1s"/><circle class="dot" cx="1150" cy="60" r="2.5" style="animation-delay:1.7s"/>
</g>
<g clip-path="url(#cp)"><rect class="shine" x="-320" y="0" width="300" height="210" fill="url(#sw)"/></g>
<defs><clipPath id="cp"><rect x="0" y="0" width="1300" height="210"/></clipPath></defs>
</svg>
