.duck{animation:walk 2.8s ease-in-out infinite}
.wl{animation:wingL 1.4s ease-in-out infinite;transform-origin:60px 125px}
.wr{animation:wingR 1.4s ease-in-out infinite;transform-origin:164px 125px}
.eye{animation:blink 4.5s ease-in-out infinite}
.dot{animation:pulse 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
